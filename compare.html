<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Phones — PhoneUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --bg-elev:#131316; --bg-card:#17171b; --line:#232327;
    --red:#e6332a; --green:#2fae63; --text:#f2f1ee; --text-dim:#9a9a9f; --text-faint:#5c5c62;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--red); color:#fff;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}

  header{position:sticky; top:0; z-index:100; background:rgba(10,10,12,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1240px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; position:relative;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo svg{height:30px; filter:drop-shadow(0 0 10px rgba(230,51,42,0.45));}
  .logo-text{font-weight:700; font-size:18px;}
  .logo-text span{color:var(--red);}
  nav.links{display:flex; align-items:center; gap:30px; font-size:14px; color:var(--text-dim);}
  nav.links a:hover{color:var(--text);}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none;}
  .burger span{width:22px; height:2px; background:var(--text);}
  nav.links.mobile-open{display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0; background:var(--bg-elev); border-bottom:1px solid var(--line); padding:8px 32px 16px; z-index:99;}
  nav.links.mobile-open a{padding:12px 0; border-bottom:1px solid var(--line);}

  .page-head{padding:44px 0 24px; text-align:center;}
  .page-head h1{font-size:30px; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px;}
  .page-head p{color:var(--text-dim); font-size:14px;}

  /* ---------- Picker ---------- */
  .picker-row{
    display:grid; grid-template-columns:1fr auto 1fr; gap:20px; align-items:center;
    padding:20px 0 10px;
  }
  .picker-slot{
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px; padding:18px;
    display:flex; align-items:center; gap:14px;
  }
  .picker-thumb{width:56px; height:70px; border-radius:12px; flex-shrink:0;}
  .picker-slot select{
    width:100%; background:var(--bg-elev); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:10px; font-size:13px; font-family:'Inter',sans-serif; outline:none; cursor:pointer;
  }
  .picker-slot select:hover{border-color:var(--red);}
  .vs-badge{
    width:44px; height:44px; border-radius:50%; background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;
    box-shadow:0 0 20px -4px rgba(230,51,42,0.8);
  }

  .g1{background:linear-gradient(135deg,#6a3ad1,#e6332a);}
  .g2{background:linear-gradient(135deg,#1fb6a6,#e8e35e);}
  .g3{background:linear-gradient(135deg,#3a63e6,#c23ad6);}
  .g4{background:linear-gradient(135deg,#2f2f34,#8a8a92);}
  .g5{background:linear-gradient(135deg,#e6332a,#ff9d6c);}
  .g7{background:linear-gradient(135deg,#d6336c,#e6332a);}

  /* ---------- Comparison table ---------- */
  .cmp-table{margin-top:30px;}
  .cmp-header{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px 16px 0 0; overflow:hidden;
    text-align:center; padding:22px 10px;
  }
  .cmp-header .colname{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
  .cmp-header .phonecol{font-size:16px; font-weight:700; margin-top:6px;}
  .cmp-header .pricecol{font-size:13px; color:var(--red); margin-top:4px;}

  .cmp-group-title{
    background:var(--bg-elev); border-left:1px solid var(--line); border-right:1px solid var(--line);
    padding:10px 20px; font-size:12px; color:var(--red); text-transform:uppercase; letter-spacing:.05em; font-weight:600;
  }
  .cmp-row{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:0; align-items:center;
    border-left:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .cmp-row .label{padding:14px 20px; color:var(--text-faint); font-size:12px;}
  .cmp-row .val{padding:14px 10px; text-align:center; color:var(--text-dim); transition:.2s;}
  .cmp-row .val.winner{color:var(--green); font-weight:600; background:rgba(47,174,99,0.08);}
  .cmp-table-bottom{
    border:1px solid var(--line); border-top:none; border-radius:0 0 16px 16px; height:14px;
    background:var(--bg-card);
  }

  .verdict{
    margin-top:24px; background:var(--bg-card); border:1px solid var(--line); border-radius:16px;
    padding:22px; text-align:center;
  }
  .verdict .title{font-size:13px; color:var(--text-faint); margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}
  .verdict .winner-name{font-size:18px; font-weight:700; color:var(--green);}
  .verdict p{color:var(--text-dim); font-size:13px; margin-top:8px; max-width:480px; margin-left:auto; margin-right:auto; line-height:1.6;}

  footer{border-top:1px solid var(--line); padding:30px 32px; text-align:center; color:var(--text-faint); font-size:12px; margin-top:50px;}
  footer a{margin:0 6px;}
  footer a:hover{color:var(--red);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); border:1px solid var(--red); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.3s; z-index:200;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:760px){
    nav.links{display:none;}
    .burger{display:flex;}
    .picker-row{grid-template-columns:1fr; }
    .vs-badge{margin:0 auto;}
    .cmp-row .label{display:none;}
    .cmp-header, .cmp-row{grid-template-columns:1fr 1fr;}
    .cmp-group-title{font-size:11px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo">
      <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8 C26 2, 14 2, 6 10 C14 10, 22 13, 28 20 C22 20, 12 22, 4 30 C14 30, 24 27, 30 20 L32 40 L34 20 C40 27, 50 30, 60 30 C52 22, 42 20, 36 20 C42 13, 50 10, 58 10 C50 2, 38 2, 32 8 Z" fill="#e6332a"/>
      </svg>
      <span class="logo-text">Phone<span>Up</span></span>
    </div>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="phones.html">Phones</a>
      <a href="#" style="color:#f2f1ee">Compare</a>
      <a href="#">Reviews</a>
      <a href="#">Latest</a>
      <a href="#">Best Phones</a>
      <a href="#">Brands</a>
    </nav>
    <button class="burger"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>Compare Phones</h1>
    <p>Pick two phones to see a full side-by-side specification breakdown</p>
  </div>

  <div class="picker-row">
    <div class="picker-slot">
      <div class="picker-thumb g1" id="thumbA"></div>
      <select id="selectA"></select>
    </div>
    <div class="vs-badge">VS</div>
    <div class="picker-slot">
      <div class="picker-thumb g3" id="thumbB"></div>
      <select id="selectB"></select>
    </div>
  </div>

  <div class="cmp-table" id="cmpTable"></div>
  <div class="verdict" id="verdict"></div>
</div>

<footer>
  <div><a href="#">About</a>·<a href="#">Contact</a>·<a href="#">Privacy Policy</a>·<a href="#">Terms</a>·<a href="#">FAQ</a>·<a href="#">Social Media</a></div>
  <div style="margin-top:10px;">© 2026 PhoneUp. All rights reserved.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
  const phones = {
    "Galaxy Fold X": {brand:"Samsung", price:1899, g:"g1", display:"7.6\" AMOLED 120Hz", chipset:"Snapdragon 8 Elite", ram:"16GB", storage:"512GB", rearCam:"200MP + 12MP + 10MP", frontCam:"10MP", battery:4800, charging:"45W", weight:239, rating:9.2},
    "Pixel Aura": {brand:"Google", price:999, g:"g2", display:"6.7\" OLED 120Hz", chipset:"Tensor G5", ram:"12GB", storage:"256GB", rearCam:"50MP + 48MP", frontCam:"11MP", battery:5000, charging:"30W", weight:198, rating:8.6},
    "Xperia Neo": {brand:"Sony", price:1299, g:"g3", display:"6.5\" OLED 120Hz", chipset:"Snapdragon 8 Elite", ram:"12GB", storage:"256GB", rearCam:"48MP + 12MP + 12MP", frontCam:"12MP", battery:5000, charging:"30W", weight:187, rating:8.7},
    "iPhone 18 Pro": {brand:"Apple", price:1199, g:"g4", display:"6.3\" OLED 120Hz", chipset:"A19 Pro", ram:"8GB", storage:"256GB", rearCam:"48MP + 48MP + 12MP", frontCam:"12MP", battery:4400, charging:"35W", weight:206, rating:9.4},
    "Xiaomi Ultra 15": {brand:"Xiaomi", price:899, g:"g5", display:"6.8\" AMOLED 120Hz", chipset:"Snapdragon 8 Elite", ram:"16GB", storage:"512GB", rearCam:"50MP + 50MP + 50MP", frontCam:"32MP", battery:5300, charging:"90W", weight:220, rating:9.0},
    "iPhone 17 Air": {brand:"Apple", price:1098, g:"g7", display:"6.6\" OLED 120Hz", chipset:"A19", ram:"8GB", storage:"256GB", rearCam:"48MP", frontCam:"12MP", battery:3900, charging:"30W", weight:165, rating:9.1},
  };

  const names = Object.keys(phones);
  const selectA = document.getElementById('selectA');
  const selectB = document.getElementById('selectB');
  names.forEach(n => {
    selectA.innerHTML += `<option value="${n}">${n}</option>`;
    selectB.innerHTML += `<option value="${n}">${n}</option>`;
  });
  selectA.value = "Galaxy Fold X";
  selectB.value = "Xperia Neo";

  const rows = [
    {group:"Overview", items:[
      {label:"Brand", key:"brand", type:"text"},
      {label:"Price", key:"price", type:"price", lowerBetter:true},
      {label:"PhoneUp Rating", key:"rating", type:"rating", lowerBetter:false},
    ]},
    {group:"Display", items:[
      {label:"Screen", key:"display", type:"text"},
    ]},
    {group:"Performance", items:[
      {label:"Chipset", key:"chipset", type:"text"},
      {label:"RAM", key:"ram", type:"size", lowerBetter:false},
      {label:"Storage", key:"storage", type:"size", lowerBetter:false},
    ]},
    {group:"Camera", items:[
      {label:"Rear Camera", key:"rearCam", type:"text"},
      {label:"Front Camera", key:"frontCam", type:"text"},
    ]},
    {group:"Battery", items:[
      {label:"Capacity", key:"battery", type:"number", unit:" mAh", lowerBetter:false},
      {label:"Charging Speed", key:"charging", type:"size", lowerBetter:false},
    ]},
    {group:"Build", items:[
      {label:"Weight", key:"weight", type:"number", unit:"g", lowerBetter:true},
    ]},
  ];

  function parseNum(v){ const m = String(v).match(/[\d.]+/); return m ? parseFloat(m[0]) : 0; }

  function renderTable(){
    const a = phones[selectA.value];
    const b = phones[selectB.value];
    document.getElementById('thumbA').className = 'picker-thumb ' + a.g;
    document.getElementById('thumbB').className = 'picker-thumb ' + b.g;

    let html = `<div class="cmp-header">
      <div><div class="colname">Spec</div></div>
      <div><div class="colname">Phone A</div><div class="phonecol">${selectA.value}</div><div class="pricecol">$${a.price.toLocaleString()}</div></div>
      <div><div class="colname">Phone B</div><div class="phonecol">${selectB.value}</div><div class="pricecol">$${b.price.toLocaleString()}</div></div>
    </div>`;

    let aWins = 0, bWins = 0;

    rows.forEach(group => {
      html += `<div class="cmp-group-title">${group.group}</div>`;
      group.items.forEach(item => {
        const va = a[item.key], vb = b[item.key];
        let aClass = '', bClass = '';
        if(item.type !== 'text'){
          const na = parseNum(va), nb = parseNum(vb);
          if(na !== nb){
            const aBetter = item.lowerBetter ? na < nb : na > nb;
            if(aBetter){ aClass = 'winner'; aWins++; } else { bClass = 'winner'; bWins++; }
          }
        }
        const displayA = item.unit ? va + item.unit : va;
        const displayB = item.unit ? vb + item.unit : vb;
        html += `<div class="cmp-row">
          <div class="label">${item.label}</div>
          <div class="val ${aClass}">${displayA}</div>
          <div class="val ${bClass}">${displayB}</div>
        </div>`;
      });
    });
    html += `<div class="cmp-table-bottom"></div>`;
    document.getElementById('cmpTable').innerHTML = html;

    const verdict = document.getElementById('verdict');
    if(aWins === bWins){
      verdict.innerHTML = `<div class="title">Verdict</div><div class="winner-name" style="color:var(--text)">It's a close call</div><p>${selectA.value} and ${selectB.value} trade wins fairly evenly across categories — your choice comes down to priorities like camera style, price, or ecosystem.</p>`;
    } else {
      const winnerName = aWins > bWins ? selectA.value : selectB.value;
      verdict.innerHTML = `<div class="title">Verdict</div><div class="winner-name">${winnerName} wins ${Math.max(aWins,bWins)}–${Math.min(aWins,bWins)}</div><p>${winnerName} leads on more measured specs in this comparison, but check the individual rows above — the "best" phone depends on what matters most to you.</p>`;
    }
  }

  selectA.addEventListener('change', () => { if(selectA.value === selectB.value) showToast('Tip: pick two different phones for a clearer comparison'); renderTable(); });
  selectB.addEventListener('change', () => { if(selectA.value === selectB.value) showToast('Tip: pick two different phones for a clearer comparison'); renderTable(); });

  renderTable();

  // Mobile menu
  const burger = document.querySelector('.burger');
  const nav = document.querySelector('nav.links');
  burger.addEventListener('click', () => nav.classList.toggle('mobile-open'));
  document.querySelectorAll('nav a').forEach(link => link.addEventListener('click', () => nav.classList.remove('mobile-open')));

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>

</body>
</html>
