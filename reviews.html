<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews — PhoneUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0c; --bg-elev:#131316; --bg-card:#17171b; --line:#232327; --red:#e6332a; --text:#f2f1ee; --text-dim:#9a9a9f; --text-faint:#5c5c62;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--red); color:#fff;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 32px;}

  header{position:sticky; top:0; z-index:100; background:rgba(10,10,12,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1240px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; position:relative;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo svg{height:30px; filter:drop-shadow(0 0 10px rgba(230,51,42,0.45));}
  .logo-text{font-weight:700; font-size:18px;}
  .logo-text span{color:var(--red);}
  nav.links{display:flex; align-items:center; gap:30px; font-size:14px; color:var(--text-dim);}
  nav.links a:hover{color:var(--text);}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none;}
  .burger span{width:22px; height:2px; background:var(--text);}
  nav.links.mobile-open{display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0; background:var(--bg-elev); border-bottom:1px solid var(--line); padding:8px 32px 16px; z-index:99;}
  nav.links.mobile-open a{padding:12px 0; border-bottom:1px solid var(--line);}

  .page-head{padding:44px 0 24px;}
  .page-head h1{font-size:30px; font-weight:700; letter-spacing:-0.02em; margin-bottom:6px;}
  .page-head p{color:var(--text-dim); font-size:14px;}

  .review-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding-bottom:60px;}
  .review-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:18px; padding:20px; cursor:pointer; transition:.22s;
    display:flex; flex-direction:column;
  }
  .review-card:hover{transform:translateY(-4px); border-color:rgba(230,51,42,0.4); box-shadow:0 14px 30px -14px rgba(0,0,0,0.7);}
  .rv-thumb{height:140px; border-radius:12px; margin-bottom:16px; position:relative;}
  .score-pill{
    position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.55); backdrop-filter:blur(6px);
    color:#fff; font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px;
  }
  .rv-name{font-size:15px; font-weight:600; margin-bottom:4px;}
  .rv-meta{font-size:11px; color:var(--text-faint); margin-bottom:10px;}
  .rv-excerpt{font-size:12px; color:var(--text-dim); line-height:1.6; margin-bottom:14px; flex:1;}
  .rv-link{font-size:12px; color:var(--text); border-bottom:1px solid var(--red); align-self:flex-start; padding-bottom:1px;}

  .g1{background:linear-gradient(135deg,#6a3ad1,#e6332a);}
  .g2{background:linear-gradient(135deg,#1fb6a6,#e8e35e);}
  .g3{background:linear-gradient(135deg,#3a63e6,#c23ad6);}
  .g4{background:linear-gradient(135deg,#2f2f34,#8a8a92);}
  .g5{background:linear-gradient(135deg,#e6332a,#ff9d6c);}
  .g6{background:linear-gradient(135deg,#20202a,#4a4a58);}

  footer{border-top:1px solid var(--line); padding:30px 32px; text-align:center; color:var(--text-faint); font-size:12px;}
  footer a{margin:0 6px;}
  footer a:hover{color:var(--red);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); border:1px solid var(--red); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.3s; z-index:200;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:800px){
    nav.links{display:none;}
    .burger{display:flex;}
    .review-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo">
      <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8 C26 2, 14 2, 6 10 C14 10, 22 13, 28 20 C22 20, 12 22, 4 30 C14 30, 24 27, 30 20 L32 40 L34 20 C40 27, 50 30, 60 30 C52 22, 42 20, 36 20 C42 13, 50 10, 58 10 C50 2, 38 2, 32 8 Z" fill="#e6332a"/>
      </svg>
      <span class="logo-text">Phone<span>Up</span></span>
    </div>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="phones.html">Phones</a>
      <a href="compare.html">Compare</a>
      <a href="#" style="color:#f2f1ee">Reviews</a>
      <a href="latest.html">Latest</a>
      <a href="best-phones.html">Best Phones</a>
      <a href="brands.html">Brands</a>
    </nav>
    <button class="burger"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>Reviews</h1>
    <p>In-depth, hands-on reviews written by the PhoneUp team</p>
  </div>
  <div class="review-grid" id="reviewGrid"></div>
</div>

<footer>
  <div><a href="#">About</a>·<a href="#">Contact</a>·<a href="#">Privacy Policy</a>·<a href="#">Terms</a>·<a href="#">FAQ</a>·<a href="#">Social Media</a></div>
  <div style="margin-top:10px;">© 2026 PhoneUp. All rights reserved.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
  const reviews = [
    {name:"Galaxy Fold X", g:"g1", score:9.2, date:"Jul 29, 2026", excerpt:"Samsung's most refined foldable to date, with a nearly invisible crease and flagship-level performance."},
    {name:"Pixel Aura", g:"g2", score:8.6, date:"Jul 22, 2026", excerpt:"Clean software and an excellent camera stack, though charging speeds trail the competition this year."},
    {name:"Xperia Neo", g:"g3", score:8.7, date:"Jul 14, 2026", excerpt:"A niche pick for audio and photography purists, with class-leading color accuracy on its display."},
    {name:"iPhone 18 Pro", g:"g5", score:9.4, date:"Jun 15, 2026", excerpt:"The most capable iPhone camera system yet, paired with best-in-class sustained performance."},
    {name:"Xiaomi Ultra 15", g:"g6", score:9.0, date:"May 25, 2026", excerpt:"A genuine flagship killer — triple 50MP cameras and blistering 90W charging at a mid-range price."},
    {name:"Honor Magic 8", g:"g4", score:8.3, date:"May 11, 2026", excerpt:"Solid all-rounder let down slightly by average low-light photography compared to rivals."},
  ];

  document.getElementById('reviewGrid').innerHTML = reviews.map(r => `
    <div class="review-card" onclick="showToast('Opening full review of ${r.name}')">
      <div class="rv-thumb ${r.g}"><span class="score-pill">${r.score}/10</span></div>
      <div class="rv-name">${r.name}</div>
      <div class="rv-meta">Reviewed ${r.date}</div>
      <p class="rv-excerpt">${r.excerpt}</p>
      <a class="rv-link">Read Full Review</a>
    </div>
  `).join('');

  const burger = document.querySelector('.burger');
  const nav = document.querySelector('nav.links');
  burger.addEventListener('click', () => nav.classList.toggle('mobile-open'));
  document.querySelectorAll('nav a').forEach(link => link.addEventListener('click', () => nav.classList.remove('mobile-open')));

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>

</body>
</html>
