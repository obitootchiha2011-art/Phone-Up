<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brands — PhoneUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --bg-elev:#131316; --bg-card:#17171b; --line:#232327;
    --red:#e6332a; --text:#f2f1ee; --text-dim:#9a9a9f; --text-faint:#5c5c62;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--red); color:#fff;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 32px;}

  header{position:sticky; top:0; z-index:100; background:rgba(10,10,12,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1240px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; position:relative;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo svg{height:30px; filter:drop-shadow(0 0 10px rgba(230,51,42,0.45));}
  .logo-text{font-weight:700; font-size:18px;}
  .logo-text span{color:var(--red);}
  nav.links{display:flex; align-items:center; gap:30px; font-size:14px; color:var(--text-dim);}
  nav.links a:hover{color:var(--text);}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none;}
  .burger span{width:22px; height:2px; background:var(--text);}
  nav.links.mobile-open{display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0; background:var(--bg-elev); border-bottom:1px solid var(--line); padding:8px 32px 16px; z-index:99;}
  nav.links.mobile-open a{padding:12px 0; border-bottom:1px solid var(--line);}

  .page-head{padding:44px 0 24px; text-align:center;}
  .page-head h1{font-size:30px; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px;}
  .page-head p{color:var(--text-dim); font-size:14px;}

  .search-mini{
    display:flex; align-items:center; gap:8px; max-width:340px; margin:0 auto 36px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
  }
  .search-mini:focus-within{border-color:var(--red);}
  .search-mini input{background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; font-family:'Inter',sans-serif;}

  .brand-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; padding-bottom:60px;}
  .brand-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:18px; padding:26px 20px;
    text-align:center; cursor:pointer; transition:.22s;
  }
  .brand-card:hover{transform:translateY(-5px); border-color:rgba(230,51,42,0.45); box-shadow:0 16px 32px -16px rgba(0,0,0,0.7);}
  .brand-logo{
    width:56px; height:56px; margin:0 auto 14px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700;
    background:linear-gradient(135deg, rgba(230,51,42,0.25), rgba(230,51,42,0.05));
    border:1px solid rgba(230,51,42,0.3); color:var(--red);
  }
  .brand-card h3{font-size:15px; font-weight:600; margin-bottom:4px;}
  .brand-card .count{font-size:12px; color:var(--text-faint);}
  .brand-card.hidden{display:none;}

  footer{border-top:1px solid var(--line); padding:30px 32px; text-align:center; color:var(--text-faint); font-size:12px;}
  footer a{margin:0 6px;}
  footer a:hover{color:var(--red);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); border:1px solid var(--red); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.3s; z-index:200;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:800px){
    nav.links{display:none;}
    .burger{display:flex;}
    .brand-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo">
      <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8 C26 2, 14 2, 6 10 C14 10, 22 13, 28 20 C22 20, 12 22, 4 30 C14 30, 24 27, 30 20 L32 40 L34 20 C40 27, 50 30, 60 30 C52 22, 42 20, 36 20 C42 13, 50 10, 58 10 C50 2, 38 2, 32 8 Z" fill="#e6332a"/>
      </svg>
      <span class="logo-text">Phone<span>Up</span></span>
    </div>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="phones.html">Phones</a>
      <a href="compare.html">Compare</a>
      <a href="#">Reviews</a>
      <a href="#">Latest</a>
      <a href="#">Best Phones</a>
      <a href="#" style="color:#f2f1ee">Brands</a>
    </nav>
    <button class="burger"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>Browse by Brand</h1>
    <p>Explore every phone manufacturer available on PhoneUp</p>
  </div>

  <div class="search-mini">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="brandSearch" placeholder="Search a brand...">
  </div>

  <div class="brand-grid" id="brandGrid"></div>
</div>

<footer>
  <div><a href="#">About</a>·<a href="#">Contact</a>·<a href="#">Privacy Policy</a>·<a href="#">Terms</a>·<a href="#">FAQ</a>·<a href="#">Social Media</a></div>
  <div style="margin-top:10px;">© 2026 PhoneUp. All rights reserved.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
  const brands = [
    {name:"Samsung", count:14, init:"S"},
    {name:"Apple", count:9, init:"A"},
    {name:"Xiaomi", count:12, init:"X"},
    {name:"Honor", count:7, init:"H"},
    {name:"Oppo", count:8, init:"O"},
    {name:"Vivo", count:6, init:"V"},
    {name:"Huawei", count:10, init:"HW"},
    {name:"Google Pixel", count:5, init:"G"},
    {name:"Nothing", count:3, init:"N"},
    {name:"OnePlus", count:6, init:"OP"},
    {name:"Motorola", count:5, init:"M"},
    {name:"Realme", count:7, init:"R"},
  ];

  const grid = document.getElementById('brandGrid');
  grid.innerHTML = brands.map(b => `
    <div class="brand-card" data-name="${b.name.toLowerCase()}" onclick="showToast('Opening ${b.name} phones...')">
      <div class="brand-logo">${b.init}</div>
      <h3>${b.name}</h3>
      <div class="count">${b.count} phones</div>
    </div>
  `).join('');

  document.getElementById('brandSearch').addEventListener('input', function(){
    const q = this.value.toLowerCase();
    document.querySelectorAll('.brand-card').forEach(card => {
      card.classList.toggle('hidden', !card.dataset.name.includes(q));
    });
  });

  const burger = document.querySelector('.burger');
  const nav = document.querySelector('nav.links');
  burger.addEventListener('click', () => nav.classList.toggle('mobile-open'));
  document.querySelectorAll('nav a').forEach(link => link.addEventListener('click', () => nav.classList.remove('mobile-open')));

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>

</body>
</html>
