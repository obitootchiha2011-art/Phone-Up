<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Phones — PhoneUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0c; --bg-elev:#131316; --bg-card:#17171b; --line:#232327; --red:#e6332a; --text:#f2f1ee; --text-dim:#9a9a9f; --text-faint:#5c5c62;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--red); color:#fff;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 32px;}

  header{position:sticky; top:0; z-index:100; background:rgba(10,10,12,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1240px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; position:relative;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo svg{height:30px; filter:drop-shadow(0 0 10px rgba(230,51,42,0.45));}
  .logo-text{font-weight:700; font-size:18px;}
  .logo-text span{color:var(--red);}
  nav.links{display:flex; align-items:center; gap:30px; font-size:14px; color:var(--text-dim);}
  nav.links a:hover{color:var(--text);}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none;}
  .burger span{width:22px; height:2px; background:var(--text);}
  nav.links.mobile-open{display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0; background:var(--bg-elev); border-bottom:1px solid var(--line); padding:8px 32px 16px; z-index:99;}
  nav.links.mobile-open a{padding:12px 0; border-bottom:1px solid var(--line);}

  .page-head{padding:44px 0 24px; text-align:center;}
  .page-head h1{font-size:30px; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px;}
  .page-head p{color:var(--text-dim); font-size:14px;}

  .cat-tabs{display:flex; gap:8px; overflow-x:auto; padding:6px 0 30px; scrollbar-width:none;}
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex-shrink:0; display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px;
    background:var(--bg-card); border:1px solid var(--line); font-size:13px; color:var(--text-dim); cursor:pointer; transition:.2s;
  }
  .cat-tab.active, .cat-tab:hover{border-color:var(--red); color:var(--text); background:rgba(230,51,42,0.08);}

  .leaderboard{display:flex; flex-direction:column; gap:12px; padding-bottom:60px;}
  .lb-card{
    display:grid; grid-template-columns:40px 90px 1fr auto; gap:18px; align-items:center;
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px; padding:14px 18px;
    cursor:pointer; transition:.2s;
  }
  .lb-card:hover{border-color:rgba(230,51,42,0.4); transform:translateX(4px);}
  .rank{font-size:20px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--text-faint); text-align:center;}
  .rank.gold{color:#e6b422;}
  .rank.silver{color:#c4c4c4;}
  .rank.bronze{color:#c8763a;}
  .lb-thumb{height:64px; border-radius:10px;}
  .lb-name{font-size:15px; font-weight:600; margin-bottom:3px;}
  .lb-metric{font-size:12px; color:var(--red); font-weight:600;}
  .lb-score{text-align:right;}
  .lb-score .num{font-size:16px; font-weight:700;}
  .lb-score .lab{font-size:10px; color:var(--text-faint); text-transform:uppercase;}

  .g1{background:linear-gradient(135deg,#6a3ad1,#e6332a);}
  .g2{background:linear-gradient(135deg,#1fb6a6,#e8e35e);}
  .g3{background:linear-gradient(135deg,#3a63e6,#c23ad6);}
  .g4{background:linear-gradient(135deg,#2f2f34,#8a8a92);}
  .g5{background:linear-gradient(135deg,#e6332a,#ff9d6c);}

  footer{border-top:1px solid var(--line); padding:30px 32px; text-align:center; color:var(--text-faint); font-size:12px;}
  footer a{margin:0 6px;}
  footer a:hover{color:var(--red);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); border:1px solid var(--red); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.3s; z-index:200;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:700px){
    nav.links{display:none;}
    .burger{display:flex;}
    .lb-card{grid-template-columns:30px 60px 1fr; gap:12px;}
    .lb-score{grid-column:3; text-align:left; margin-top:4px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo">
      <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8 C26 2, 14 2, 6 10 C14 10, 22 13, 28 20 C22 20, 12 22, 4 30 C14 30, 24 27, 30 20 L32 40 L34 20 C40 27, 50 30, 60 30 C52 22, 42 20, 36 20 C42 13, 50 10, 58 10 C50 2, 38 2, 32 8 Z" fill="#e6332a"/>
      </svg>
      <span class="logo-text">Phone<span>Up</span></span>
    </div>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="phones.html">Phones</a>
      <a href="compare.html">Compare</a>
      <a href="#">Reviews</a>
      <a href="latest.html">Latest</a>
      <a href="#" style="color:#f2f1ee">Best Phones</a>
      <a href="brands.html">Brands</a>
    </nav>
    <button class="burger"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>Best Phones</h1>
    <p>Category leaderboards ranked by PhoneUp's testing data</p>
  </div>

  <div class="cat-tabs" id="catTabs"></div>
  <div class="leaderboard" id="leaderboard"></div>
</div>

<footer>
  <div><a href="#">About</a>·<a href="#">Contact</a>·<a href="#">Privacy Policy</a>·<a href="#">Terms</a>·<a href="#">FAQ</a>·<a href="#">Social Media</a></div>
  <div style="margin-top:10px;">© 2026 PhoneUp. All rights reserved.</div>
</footer>

<div class="toast" id="toast"></div>

<script>
  const categories = {
    camera: {icon:"📷", label:"Best Camera", metric:"Camera Score", data:[
      {name:"iPhone 18 Pro", g:"g5", score:9.6},
      {name:"Xiaomi Ultra 15", g:"g1", score:9.4},
      {name:"Galaxy Fold X", g:"g2", score:9.0},
      {name:"Xperia Neo", g:"g3", score:8.9},
      {name:"Pixel Aura", g:"g4", score:8.7},
    ]},
    battery: {icon:"🔋", label:"Best Battery", metric:"Battery Life", data:[
      {name:"Xiaomi Ultra 15", g:"g1", score:9.5},
      {name:"Pixel Aura", g:"g4", score:8.9},
      {name:"Xperia Neo", g:"g3", score:8.6},
      {name:"Galaxy Fold X", g:"g2", score:8.5},
      {name:"iPhone 18 Pro", g:"g5", score:8.0},
    ]},
    performance: {icon:"⚡", label:"Best Performance", metric:"Benchmark Score", data:[
      {name:"iPhone 18 Pro", g:"g5", score:9.8},
      {name:"Galaxy Fold X", g:"g2", score:9.6},
      {name:"Xiaomi Ultra 15", g:"g1", score:9.5},
      {name:"Xperia Neo", g:"g3", score:9.3},
      {name:"Pixel Aura", g:"g4", score:9.0},
    ]},
    display: {icon:"🖥️", label:"Best Display", metric:"Display Score", data:[
      {name:"Galaxy Fold X", g:"g2", score:9.5},
      {name:"Xiaomi Ultra 15", g:"g1", score:9.3},
      {name:"iPhone 18 Pro", g:"g5", score:9.2},
      {name:"Pixel Aura", g:"g4", score:9.0},
      {name:"Xperia Neo", g:"g3", score:8.8},
    ]},
    gaming: {icon:"🎮", label:"Best Gaming", metric:"Gaming Score", data:[
      {name:"iPhone 18 Pro", g:"g5", score:9.7},
      {name:"Xiaomi Ultra 15", g:"g1", score:9.6},
      {name:"Galaxy Fold X", g:"g2", score:9.2},
      {name:"Xperia Neo", g:"g3", score:9.0},
      {name:"Pixel Aura", g:"g4", score:8.4},
    ]},
    value: {icon:"💰", label:"Best Value", metric:"Value Score", data:[
      {name:"Xiaomi Ultra 15", g:"g1", score:9.4},
      {name:"Pixel Aura", g:"g4", score:9.1},
      {name:"iPhone 18 Pro", g:"g5", score:8.2},
      {name:"Xperia Neo", g:"g3", score:8.0},
      {name:"Galaxy Fold X", g:"g2", score:7.8},
    ]},
  };

  const tabsEl = document.getElementById('catTabs');
  const boardEl = document.getElementById('leaderboard');
  const keys = Object.keys(categories);

  tabsEl.innerHTML = keys.map((k,i) => `<div class="cat-tab ${i===0?'active':''}" data-cat="${k}">${categories[k].icon} ${categories[k].label}</div>`).join('');

  function renderBoard(catKey){
    const cat = categories[catKey];
    const rankClass = i => i===0?'gold':i===1?'silver':i===2?'bronze':'';
    boardEl.innerHTML = cat.data.map((p,i) => `
      <div class="lb-card" onclick="showToast('Opening ${p.name}')">
        <div class="rank ${rankClass(i)}">${i+1}</div>
        <div class="lb-thumb ${p.g}"></div>
        <div>
          <div class="lb-name">${p.name}</div>
          <div class="lb-metric">${cat.icon} ${cat.metric}</div>
        </div>
        <div class="lb-score"><div class="num">${p.score}</div><div class="lab">/10</div></div>
      </div>
    `).join('');
  }

  tabsEl.addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if(!tab) return;
    tabsEl.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderBoard(tab.dataset.cat);
  });

  renderBoard(keys[0]);

  const burger = document.querySelector('.burger');
  const nav = document.querySelector('nav.links');
  burger.addEventListener('click', () => nav.classList.toggle('mobile-open'));
  document.querySelectorAll('nav a').forEach(link => link.addEventListener('click', () => nav.classList.remove('mobile-open')));

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>

</body>
</html>
